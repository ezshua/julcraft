/* ============ БАЗА ============ */
*{box-sizing:border-box;margin:0;padding:0}
img{display:block;max-width:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:#141210;color:#ece7dd}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card figure{margin:0}
@media(max-width:960px){.prods{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.prods{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}

/* ============ ПЕРЕКЛЮЧАТЕЛЬ ДИЗАЙНОВ ============ */
#bar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(16,14,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.14)}
#bar .logo{font:600 11px 'IBM Plex Mono',monospace;color:#8f887b;letter-spacing:.14em;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;border:1px solid rgba(255,255,255,.2);background:transparent;
  color:#cfc8bd;font:600 11px/1 'Manrope';letter-spacing:.06em;padding:8px 13px;border-radius:999px;transition:.25s}
.chip b{color:#847d70;font-weight:800}
.chip:hover{border-color:rgba(255,255,255,.5)}
.chip.active{background:#eae3d4;color:#181510;border-color:#eae3d4}
.chip.active b{color:#96702c}
#cnt{font:600 12px 'IBM Plex Mono';color:#9a9287;white-space:nowrap}
.navbtn{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:none;color:#eae3d4;transition:.2s}
.navbtn:hover{background:rgba(255,255,255,.12)}
main{padding-top:56px}
.design{display:none}
.design.active{display:block}
.design .anim{opacity:0;transform:translateY(26px);transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.design.in .anim{opacity:1;transform:none}

/* ============ ТЕХБЛОК (общий каркас) ============ */
.tech{margin-top:90px;padding:46px 0 90px;border-top:1px solid var(--tline,rgba(0,0,0,.25))}
.tech .tlabel{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-bottom:10px}
.tech h4{margin-bottom:26px;font-size:20px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px}
.tg h5{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
.tg p{font-size:13px;line-height:1.7;opacity:.85}
.sw{display:inline-flex;align-items:center;gap:7px;margin:0 12px 8px 0;font:500 11px 'IBM Plex Mono',monospace}
.sw i{width:20px;height:20px;border-radius:5px;background:var(--c);border:1px solid rgba(120,120,120,.45)}

/* ================================================================
   01 · ГАЛЕРЕЯ — тихий минимализм
================================================================ */
.d1{background:#F4F1EC;color:#1B1815;font-family:'Manrope';--tline:#DCD5C9}
.d1 .top{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0;border-bottom:1px solid #DCD5C9}
.d1 .brand{font-family:'Cormorant Garamond';font-size:23px;font-weight:600}
.d1 .topnav{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#797168}
.d1 .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:end;padding:72px 0 44px}
.d1 h1{font-family:'Cormorant Garamond';font-weight:500;font-size:clamp(46px,6.5vw,92px);line-height:1.0;letter-spacing:-.01em}
.d1 h1 em{color:#A98A57}
.d1 .hero p{color:#797168;font-size:14px;line-height:1.75;max-width:36ch;justify-self:end}
.d1 .heroimg img{width:100%;height:520px;object-fit:cover}
.d1 .cap{display:flex;justify-content:space-between;gap:20px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#797168;border-top:1px solid #DCD5C9;margin-top:12px;padding-top:10px}
.d1 .seclab{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#A98A57;margin:70px 0 24px}
.d1 .seclab::after{content:&quot;&quot;;height:1px;flex:1;background:#DCD5C9}
.d1 .card{border:1px solid #DCD5C9;background:#FBF9F5;transition:transform .35s,box-shadow .35s}
.d1 .card:hover{transform:translateY(-5px);box-shadow:0 30px 50px -32px rgba(27,24,21,.4)}
.d1 .im{overflow:hidden}
.d1 .card img{width:100%;height:280px;object-fit:cover;transition:transform .9s ease}
.d1 .card:hover img{transform:scale(1.06)}
.d1 .tx{padding:18px 20px 22px;border-top:1px solid #DCD5C9}
.d1 .num{font:500 11px 'IBM Plex Mono';color:#A98A57}
.d1 .card h3{font-family:'Cormorant Garamond';font-size:23px;font-weight:600;margin:6px 0}
.d1 .card p{font-size:12.5px;line-height:1.65;color:#797168;margin-bottom:12px}
.d1 .price{font-weight:800;font-size:13px}
.d1 .mats{display:flex;flex-wrap:wrap;gap:14px 34px;padding:56px 0 0;margin-top:70px;border-top:1px solid #DCD5C9}
.d1 .mats span{font-family:'Cormorant Garamond';font-size:20px;font-style:italic;color:#4d463d}
.d1 .mats span::before{content:&quot;—&quot;;color:#A98A57;margin-right:10px}
.d1 .steps{margin-top:56px}
.d1 .step b{font:500 11px 'IBM Plex Mono';color:#A98A57}
.d1 .step h4{font-family:'Cormorant Garamond';font-size:22px;margin:8px 0 6px}
.d1 .step p{font-size:12.5px;color:#797168;line-height:1.65}
@media(max-width:900px){.d1 .hero{grid-template-columns:1fr}.d1 .hero p{justify-self:start}}

/* ================================================================
   02 · НУАР — тёмная высокая ювелирка

.d2{background:#0E0C0A;color:#EDE6D8;font-family:'Manrope';--tline:rgba(201,162,39,.35)}
.d2 .top{display:flex;justify-content:center;padding:30px 0;letter-spacing:.42em;font-size:12px;text-transform:uppercase;color:#C9A227;border-bottom:1px solid rgba(201,162,39,.3)}
.d2 .hero{text-align:center;padding:80px 0 60px}
.d2 .over{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#8D857A}
.d2 h1{font-family:'Playfair Display';font-weight:700;font-size:clamp(40px,6vw,84px);line-height:1.08;margin:22px auto;max-width:18ch}
.d2 h1 em{font-style:italic;color:#C9A227}
.d2 .hero p{color:#8D857A;max-width:52ch;margin:0 auto 34px;font-size:14px;line-height:1.8}
.d2 .lnk{display:inline-block;border:1px solid #C9A227;color:#C9A227;padding:14px 34px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;transition:.3s}
.d2 .lnk:hover{background:#C9A227;color:#0E0C0A}
.d2 .frame{max-width:760px;margin:0 auto;padding:14px;border:1px solid rgba(201,162,39,.5);outline:1px solid rgba(201,162,39,.25);outline-offset:8px}

.d2 .seclab::before,.d2 .seclab::after{content:&quot;———&quot;;color:rgba(201,162,39,.4);margin:0 16px;letter-spacing:0}
.d2 .card{border:1px solid rgba(201,162,39,.25);background:#141110;transition:border-color .3s}
.d2 .card:hover{border-color:#C9A227}
.d2 .card img{width:100%;height:260px;object-fit:cover;filter:grayscale(.15) contrast(1.05)}

&lt;!-- ================= 01 ГАЛЕРЕЯ ================= --&gt;
&lt;section class=&quot;design d1&quot; id=&quot;d1&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;header class=&quot;top anim&quot;&gt;&lt;div class=&quot;brand&quot;&gt;Тихое золото&lt;/div&gt;&lt;div class=&quot;topnav&quot;&gt;Коллекция · Материалы · Процесс · Заказ&lt;/div&gt;&lt;/header&gt;
    &lt;div class=&quot;hero&quot;&gt;
      &lt;h1 class=&quot;anim&quot; style=&quot;--d:.05s&quot;&gt;Украшения, которые молчат — &lt;em&gt;и звучат.&lt;/em&gt;&lt;/h1&gt;
      &lt;p class=&quot;anim&quot; style=&quot;--d:.15s&quot;&gt;Маленькая мастерская в Москве. Серебро, латунь и природный камень. Каждая вещь отливается и доводится вручную, тиражом не более двенадцати экземпляров.&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;heroimg anim&quot; style=&quot;--d:.2s&quot;&gt;
      &lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/19824eba9-6f09-484c-8b3e-08c5ba6fbd6a.png&quot; alt=&quot;Кольцо «Полынь» на льняной ткани&quot;&gt;
      &lt;figcaption class=&quot;cap&quot;&gt;&lt;span&gt;Съёмка № 04 · дневной свет&lt;/span&gt;&lt;span&gt;кольцо «Полынь», серебро 925&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;seclab anim&quot;&gt;Коллекция · весна&lt;/div&gt;
    &lt;div class=&quot;prods&quot;&gt;
      &lt;article class=&quot;card anim&quot; style=&quot;--d:.05s&quot;&gt;&lt;figure&gt;&lt;div class=&quot;im&quot;&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/112cf846f-baa9-4afb-a50d-05e8aa76e18d.png&quot; alt=&quot;Серьги «Дым»&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;tx&quot;&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;h3&gt;Серьги «Дым»&lt;/h3&gt;&lt;p&gt;Серебро 925, чернение, фактура ручной ковки. Лёгкие конго, которые не хочется снимать.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;5 200 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;
      &lt;article class=&quot;card anim&quot; style=&quot;--d:.15s&quot;&gt;&lt;figure&gt;&lt;div class=&quot;im&quot;&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/13d4be24f-5b91-458c-b2cd-58a849349c3c.png&quot; alt=&quot;Серьги «Пена»&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;tx&quot;&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;h3&gt;Серьги «Пена»&lt;/h3&gt;&lt;p&gt;Пресноводный жемчуг 10 мм, швендели из полированного серебра. Пара на каждый день.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;7 100 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;
      &lt;article class=&quot;card anim&quot; style=&quot;--d:.25s&quot;&gt;&lt;figure&gt;&lt;div class=&quot;im&quot;&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/1b549ce92-f85d-4a92-9230-dde16fae9db9.png&quot; alt=&quot;Перстень «Хвоя»&quot;&gt;&lt;/div&gt;
        &lt;figcaption class=&quot;tx&quot;&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;h3&gt;Перстень «Хвоя»&lt;/h3&gt;&lt;p&gt;Латунь, демантоид. Шинка повторяет изгиб ветки — форма снимается с настоящего побега.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;8 900 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;mats anim&quot;&gt;&lt;span&gt;серебро 925°&lt;/span&gt;&lt;span&gt;латунь&lt;/span&gt;&lt;span&gt;природный камень&lt;/span&gt;&lt;span&gt;жемчуг&lt;/span&gt;&lt;span&gt;горячая эмаль&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;steps&quot;&gt;
      &lt;div class=&quot;step anim&quot; style=&quot;--d:.05s&quot;&gt;&lt;b&gt;01&lt;/b&gt;&lt;h4&gt;Эскиз&lt;/h4&gt;&lt;p&gt;Карандаш на кальке. Форма рождается из наблюдения: ветка, капля, тень на стене.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step anim&quot; style=&quot;--d:.1s&quot;&gt;&lt;b&gt;02&lt;/b&gt;&lt;h4&gt;Воск&lt;/h4&gt;&lt;p&gt;Модель вырезается в воске и правится до тех пор, пока не ляжет в руку.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step anim&quot; style=&quot;--d:.15s&quot;&gt;&lt;b&gt;03&lt;/b&gt;&lt;h4&gt;Литьё&lt;/h4&gt;&lt;p&gt;Отливаем по одному в песчаной форме — поэтому вещи чуть отличаются друг от друга.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step anim&quot; style=&quot;--d:.2s&quot;&gt;&lt;b&gt;04&lt;/b&gt;&lt;h4&gt;Финиш&lt;/h4&gt;&lt;p&gt;Опиловка, шабрение, матирование или чернение. Никакого гальванического глянца.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;footer class=&quot;tech&quot;&gt;
      &lt;p class=&quot;tlabel&quot;&gt;Технический паспорт дизайна&lt;/p&gt;
      &lt;h4&gt;01 · «Галерея» — тихий минимализм&lt;/h4&gt;
      &lt;div class=&quot;tgrid&quot;&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Палитра&lt;/h5&gt;&lt;div&gt;
          &lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#F4F1EC&quot;&gt;&lt;/i&gt;#F4F1EC&lt;/span&gt;&lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#1B1815&quot;&gt;&lt;/i&gt;#1B1815&lt;/span&gt;
          &lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#A98A57&quot;&gt;&lt;/i&gt;#A98A57&lt;/span&gt;&lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#DCD5C9&quot;&gt;&lt;/i&gt;#DCD5C9&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Типографика&lt;/h5&gt;&lt;p&gt;Cormorant Garamond (дисплейная антиква, курсивные акценты) + Manrope для служебного текста. Крупный кегль, разреженные капители.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Композиция и приёмы&lt;/h5&gt;&lt;p&gt;Волосяные линии-разделители, подписи-«кейшены» как в музейных каталогах, нумерация лотов, hover-подъём карточек и медленный зум фото. Много воздуха.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Референсы&lt;/h5&gt;&lt;p&gt;Тихая роскошь: витрины Mejuri, The Row, Celine; галерейная подача предмета на нейтральном фоне.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/footer&gt;
  &lt;/div&gt;

&lt;!-- ================= 02 НУАР ================= --&gt;
&lt;section class=&quot;design d2&quot; id=&quot;d2&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;header class=&quot;top anim&quot;&gt;Тихое золото · мастерская высокой ювелирки&lt;/header&gt;
    &lt;div class=&quot;hero&quot;&gt;
      &lt;p class=&quot;over anim&quot;&gt;основана в 2016 · москва&lt;/p&gt;
      &lt;h1 class=&quot;anim&quot; style=&quot;--d:.08s&quot;&gt;Тьма — лучшая &lt;em&gt;оправа&lt;/em&gt; света.&lt;/h1&gt;
      &lt;p class=&quot;anim&quot; style=&quot;--d:.16s&quot;&gt;Мы работаем с камнем, как работают с тишиной: убираем лишнее, пока не останется главное. Золото, чернёное серебро и камни, выбранные лично.&lt;/p&gt;
      &lt;span class=&quot;lnk anim&quot; style=&quot;--d:.24s&quot;&gt;Смотреть коллекцию&lt;/span&gt;

    &lt;div class=&quot;frame anim&quot; style=&quot;--d:.3s&quot;&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/1932c6961-f145-40bf-a863-20f6e3b43259.png&quot; alt=&quot;Подвес с изумрудом на чёрном бархате&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;seclab anim&quot;&gt;Коллекция «Полночь»&lt;/div&gt;

        &lt;figcaption class=&quot;tx&quot;&gt;&lt;h3&gt;Подвес «Полночь»&lt;/h3&gt;&lt;p&gt;Золото 585, колумбийский изумруд огранки «октагон». Цепь ручного плетения «жгут».&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;по запросу&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;
      &lt;article class=&quot;card anim&quot; style=&quot;--d:.15s&quot;&gt;&lt;figure&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/112cf846f-baa9-4afb-a50d-05e8aa76e18d.png&quot; alt=&quot;Серьги «Дым»&quot;&gt;
        &lt;figcaption class=&quot;tx&quot;&gt;&lt;h3&gt;Серьги «Дым»&lt;/h3&gt;&lt;p&gt;Чернёное серебро 925. Кованая фактура держит свет, как гранёный уголь.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;5 200 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;

    &lt;blockquote class=&quot;quote anim&quot;&gt;«Камень выбирает хозяина. Мы просто делаем оправу, в которой он согласится остаться.»&lt;small&gt;— мастер-основатель&lt;/small&gt;&lt;/blockquote&gt;

        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Палитра&lt;/h5&gt;&lt;div&gt;

        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Типографика&lt;/h5&gt;&lt;p&gt;Playfair Display с курсивными вкраплениями; разреженные капители Manrope для навигации и цен. Экстремальный трекинг как знак «дорого».&lt;/p&gt;&lt;/div&gt;

&lt;!-- ================= 03 ГРАВЮРА ================= --&gt;
&lt;section class=&quot;design d3&quot; id=&quot;d3&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;page&quot;&gt;
      &lt;header class=&quot;phead anim&quot;&gt;
        &lt;p class=&quot;small&quot;&gt;Мастерская «Тихое золото» · издание третье, дополненное&lt;/p&gt;
        &lt;h1&gt;КАТАЛОГЪ ИЗДѢЛІЙ РУЧНОЙ РАБОТЫ&lt;/h1&gt;
        &lt;p class=&quot;chp&quot;&gt;Глава I. Вещи, отлитые и оправленные вручную, с приложениями о материалах&lt;/p&gt;
      &lt;/header&gt;
      &lt;div class=&quot;cols&quot;&gt;
        &lt;div class=&quot;anim&quot; style=&quot;--d:.1s&quot;&gt;
          &lt;p class=&quot;dropcap&quot;&gt;Всякая вещь нашей мастерской начинается с наблюдения. Мастер снимает форму с ветки полыни, с капли смолы, с изгиба речной гальки — и переносит её в воск, а затем в металл.&lt;/p&gt;
          &lt;p&gt;Серебро берётся пробы 925, латунь — листовая, камни — только природные, с неровностями и внутренней жизнью. Мы не полируем вещи до глянца: матовая поверхность стареет благороднее.&lt;/p&gt;
          &lt;p&gt;Тираж каждой модели — двенадцать экземпляров, и каждый нумеруется клеймом на внутренней стороне шинки.&lt;/p&gt;
        &lt;/div&gt;
        &lt;figure class=&quot;fig anim&quot; style=&quot;--d:.2s&quot;&gt;
          &lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/1c2658689-46dc-4acb-a40f-e82a051d3344.png&quot; alt=&quot;Брошь «Гранатовая» на старой бумаге&quot;&gt;
          &lt;figcaption class=&quot;figcap&quot;&gt;Фиг. 1 — Брошь «Гранатовая». Серебро, скань, гранаты-кабошоны.&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;

      &lt;div class=&quot;orn anim&quot;&gt;❦&lt;/div&gt;

      &lt;div class=&quot;tbl anim&quot; style=&quot;--d:.1s&quot;&gt;
        &lt;h3&gt;ТАБЛИЦА I · ИЗДѢЛІЯ&lt;/h3&gt;
        &lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;eno&quot;&gt;№ 1&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Брошь «Гранатовая»&lt;/h4&gt;&lt;p&gt;Сканое серебро, девять гранатов-кабошонов; работа по мотивам северного модерна.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;epr&quot;&gt;12 500 р.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;eno&quot;&gt;№ 2&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Серьги «Дым»&lt;/h4&gt;&lt;p&gt;Серебро 925, чернение; фактура ручной ковки, замок-конго.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;epr&quot;&gt;5 200 р.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;eno&quot;&gt;№ 3&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Кольцо «Полынь»&lt;/h4&gt;&lt;p&gt;Матовое серебро, белый топаз в глухой закрепке; тираж 12 экз.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;epr&quot;&gt;6 400 р.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;eno&quot;&gt;№ 4&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Серьги «Пена»&lt;/h4&gt;&lt;p&gt;Пресноводный жемчуг, серебряные швендели ручной гибки.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;epr&quot;&gt;7 100 р.&lt;/span&gt;&lt;/div&gt;
        &lt;p class=&quot;matsline&quot;&gt;Приложение: серебро 925° · латунь · гранат · топаз · жемчуг · горячая эмаль · воск формовочный.&lt;/p&gt;
      &lt;/div&gt;

      &lt;p class=&quot;pageno anim&quot;&gt;— 3 —&lt;/p&gt;
    &lt;/div&gt;

    &lt;footer class=&quot;tech&quot;&gt;
      &lt;p class=&quot;tlabel&quot;&gt;Технический паспорт дизайна&lt;/p&gt;
      &lt;h4&gt;03 · «Гравюра» — страница старого ювелирного каталога&lt;/h4&gt;
      &lt;div class=&quot;tgrid&quot;&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Палитра&lt;/h5&gt;&lt;div&gt;
          &lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#EFE3C8&quot;&gt;&lt;/i&gt;#EFE3C8&lt;/span&gt;&lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#3A2E22&quot;&gt;&lt;/i&gt;#3A2E22&lt;/span&gt;
          &lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#7C2D2A&quot;&gt;&lt;/i&gt;#7C2D2A&lt;/span&gt;&lt;span class=&quot;sw&quot;&gt;&lt;i style=&quot;--c:#6B5A41&quot;&gt;&lt;/i&gt;#6B5A41&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Типографика&lt;/h5&gt;&lt;p&gt;Forum (заголовки «под старину») + Spectral с буквицей и выключкой по ширине. Курсивные подписи фигур, как в дореволюционных изданиях.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Композиция и приёмы&lt;/h5&gt;&lt;p&gt;Двойная рамка страницы, линейки и двойные линейки, буквица, точечные отбивки в прейскуранте, сепия на фото, виньетка ❦, колонцифра «— 3 —».&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Референсы&lt;/h5&gt;&lt;p&gt;Каталоги фабрик Фаберже и Овчинникова, старые книги по ювелирному делу, антикварные прейскуранты.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/footer&gt;
  &lt;/div&gt;

        &lt;figcaption class=&quot;tx&quot;&gt;&lt;h3&gt;Серьги «Пена»&lt;/h3&gt;&lt;p&gt;Жемчуг = круг. Серебро = линия. Пара, которая работает с любой одеждой.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;7 100 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;

        &lt;figcaption class=&quot;tx&quot;&gt;&lt;h3&gt;Серьги «Дым»&lt;/h3&gt;&lt;p&gt;Кованое серебро 925. Фактура как след инструмента — без полировки.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;5 200 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;

        &lt;figcaption class=&quot;tx&quot;&gt;&lt;h3&gt;Кольцо «Полынь»&lt;/h3&gt;&lt;p&gt;Топаз в глухой закрепке. Геометрия круга, доведённая до конца.&lt;/p&gt;&lt;span class=&quot;price&quot;&gt;6 400 ₽&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;

    &lt;div class=&quot;mats anim&quot;&gt;&lt;span&gt;Серебро 925&lt;/span&gt;&lt;span&gt;Латунь&lt;/span&gt;&lt;span&gt;Эмаль&lt;/span&gt;&lt;span&gt;Жемчуг&lt;/span&gt;&lt;span&gt;Камень&lt;/span&gt;&lt;span&gt;Воск&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Типографика&lt;/h5&gt;&lt;p&gt;Unbounded 800 в верхнем регистре для плакатных заголовков + IBM Plex Mono для служебных подписей. Только гротески, только капс.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tg&quot;&gt;&lt;h5&gt;Композиция и приёмы&lt;/h5&gt;&lt;p&gt;Плакатная сетка, геометрические фигуры фоном, жёсткие тени со смещением (8px), цветные шины карточек, стикеры-материалы под наклоном.&lt;/p&gt;&lt;/div&gt;

&lt;!-- ================= 05 МОДЕРН ================= --&gt;
&lt;section class=&quot;design d5&quot; id=&quot;d5&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;header class=&quot;top anim&quot;&gt;
      &lt;div class=&quot;brand&quot;&gt;тихое золото&lt;/div&gt;

      &lt;p class=&quot;anim&quot; style=&quot;--d:.1s&quot;&gt;Наши украшения — побеги: они изгибаются, как стебель под дождём, и держат камень, как бутон держит каплю. Серебро и латунь, горячая эмаль и жемчуг.&lt;/p&gt;
      &lt;div class=&quot;arch anim&quot; style=&quot;--d:.2s&quot;&gt;&lt;img src=&quot;https://image.qwenlm.ai/public_source/b9306e40-506e-4f4b-b75b-b34055866751/13d4be24f-5b91-458c-b2cd-58a849349c3c.png&quot; alt=&quot;Жемчужные серьги на шёлке&quot;&gt;&lt;/div&gt;

&lt;script nonce=&quot;&quot;&gt;
(function(){
  var designs = Array.prototype.slice.call(document.querySelectorAll('.design'));
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var cnt = document.getElementById('cnt');
  var cur = 0;

  function pad(n){ return (n&lt;10?'0':'')+n; }

  function show(i, scroll){
    i = (i + designs.length) % designs.length;
    cur = i;
    designs.forEach(function(s,j){ s.classList.toggle('active', j===i); });
    chips.forEach(function(c,j){ c.classList.toggle('active', j===i); });
    cnt.textContent = pad(i+1)+' / '+pad(designs.length);
    var active = chips[i];
    if(active &amp;&amp; active.scrollIntoView){ active.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }
    var s = designs[i];
    s.classList.remove('in');
    void s.offsetWidth;
    s.classList.add('in');
    history.replaceState(null, '', '#'+s.id);
    if(scroll !== false){ window.scrollTo({top:0, behavior:'auto'}); }
  }

  chips.forEach(function(c){
    c.addEventListener('click', function(){ show(parseInt(c.getAttribute('data-i'),10)); });
  });
  document.getElementById('prev').addEventListener('click', function(){ show(cur-1); });
  document.getElementById('next').addEventListener('click', function(){ show(cur+1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ show(cur+1); }
    if(e.key === 'ArrowLeft'){ show(cur-1); }
  });

  var start = 0;
  var h = location.hash.replace('#','');
  designs.forEach(function(s,j){ if(s.id === h){ start = j; } });
  show(start, false);
})();
&lt;/script&gt;
