<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — JulCraft Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin page--flat">

<div class="confetti"></div>

<!-- login: центрированная карточка, фон приглушён (page--flat) -->
<div class="login-card">
  <div class="card card--flat" style="padding:40px 36px; box-shadow:10px 10px 0 var(--ink);">
    <div class="logo-big">JulCraft<i></i></div>
    <p class="sub">Панель мастера · вход</p>
    <form onsubmit="return false">
      <div class="field">
        <label for="login">Логин</label>
        <input type="text" id="login" placeholder="master@julcraft.ru" autocomplete="username">
      </div>
      <div class="field has-error">
        <label for="pass">Пароль</label>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
        <div class="err">Неверный пароль — попробуйте ещё раз</div>
      </div>
      <button class="btn btn--fill" style="width:100%;" type="submit">Войти →</button>
    </form>
    <p class="mini" style="margin-top:18px; font-size:.78rem; color:var(--muted-2);">Один аккаунт на мастерскую. Доступ выдаёт владелец.</p>
  </div>
  <p style="margin-top:26px; font-size:.82rem; color:var(--muted); font-weight:600;"><a href="../home.html" style="color:var(--ink);">← На витрину</a></p>
</div>

</body>
</html>
